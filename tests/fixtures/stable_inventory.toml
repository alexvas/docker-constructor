# docker-constructor.toml — Reviewed source of default versions, revisions, URLs,
# digests, platform artifacts, and update metadata for the pi-cli Docker image.
#
# Stages mirror Dockerfile build-graph nodes.
# Every versioned entry requires [source] and [update] metadata.
# Platform artifacts bundle URL + SHA-256 so a version cannot be reviewed
# independently from its bytes.

schema = 1

[cache]
# Default TTL in seconds (reviewed policy; no command-line override)
# ttl = 3600
#
# The cache directory is configured in docker-constructor.local.toml,
# not here.  See docker-constructor.local.example.toml for the schema.

# ---------------------------------------------------------------------------
# Base image
# ---------------------------------------------------------------------------

# --- base.node ---
[build.stages.base.node]
tag = "24.18.0-trixie-slim"
# Reviewed exact tool versions bundled with the digest-pinned image.  These
# are never inferred from the image tag.
node_version = "24.18.0"
npm_version = "11.16.0"
# Digest of node:24.18.0-trixie-slim resolved from Docker Hub manifest.
digest = "sha256:ae91dcc111a68c9d2d81ff2a17bda61be126426176fde6fe7d08ab13b7f50573"

[build.stages.base.node.source]
type = "docker-registry"
registry = "docker.io"
repository = "library/node"

[build.stages.base.node.update]
provider = "docker-registry"
stable_only = true
track = "tag-digest"

# ---------------------------------------------------------------------------
# Toolchain (builder-only, not copied into runtime)
# ---------------------------------------------------------------------------

# --- toolchain.rust ---
[build.stages.toolchain.rust]
components = ["rustfmt", "clippy"]
profile = "minimal"
version = "1.98.0"

[build.stages.toolchain.rust.rustup.artifacts.linux-amd64]
sha256 = "4acc9acc76d5079515b46346a485974457b5a79893cfb01112423c89aeb5aa10"
url = "https://static.rust-lang.org/rustup/archive/1.29.0/x86_64-unknown-linux-gnu/rustup-init"

[build.stages.toolchain.rust.rustup.source]
checksum_url = "https://static.rust-lang.org/rustup/archive/1.29.0/x86_64-unknown-linux-gnu/rustup-init.sha256"
type = "static-url"

[build.stages.toolchain.rust.rustup.update]
provider = "static-url"
stable_only = true

[build.stages.toolchain.rust.source]
manifest = "https://static.rust-lang.org/dist/channel-rust-1.98.0.toml"
type = "rust-channel"

[build.stages.toolchain.rust.update]
channel = "stable"
provider = "rust-channel"
stable_only = true

# --- toolchain.uv ---
[build.stages.toolchain.uv]
version = "0.12.5"

[build.stages.toolchain.uv.artifacts.linux-amd64]
sha256 = "68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2"
url = "https://github.com/astral-sh/uv/releases/download/0.12.5/uv-x86_64-unknown-linux-gnu.tar.gz"

[build.stages.toolchain.uv.source]
repository = "astral-sh/uv"
tag = "0.12.5"
type = "github-release"

[build.stages.toolchain.uv.update]
provider = "github-release"
required_platforms = ["linux-amd64"]
stable_only = true

# --- toolchain.python ---
[build.stages.toolchain.python]
version = "3.14.7"

[build.stages.toolchain.python.override]
allow_prerelease = false
constraint = ">=3.14.6"
scheme = "numeric"

[build.stages.toolchain.python.source]
implementation = "cpython"
type = "uv-python"

[build.stages.toolchain.python.update]
implementation = "cpython"
provider = "uv-python"
stable_only = true

# ty is installed via `uv tool install` in setup-python.sh
# --- toolchain.ty ---
[build.stages.toolchain.ty]
version = "0.0.73"

[build.stages.toolchain.ty.source]
package = "ty"
type = "pypi"

[build.stages.toolchain.ty.update]
provider = "pypi"
stable_only = true

# ---------------------------------------------------------------------------
# Prebuilt Rust tools — independent stages from base
# ---------------------------------------------------------------------------

# --- rtk-prebuilt.rtk ---
[build.stages.rtk-prebuilt.rtk]
version = "v0.45.0"

[build.stages.rtk-prebuilt.rtk.artifacts.linux-amd64]
sha256 = "0ba496b2531cd4357edfb2ac2fe2eb19ec99eb9ba46401dffa8459e1cfbd0061"
url = "https://github.com/rtk-ai/rtk/releases/download/v0.45.0/rtk_amd64.deb"

[build.stages.rtk-prebuilt.rtk.source]
repository = "rtk-ai/rtk"
tag = "v0.45.0"
type = "github-release"

[build.stages.rtk-prebuilt.rtk.update]
provider = "github-release"
required_platforms = ["linux-amd64"]
stable_only = true
tag_prefix = "v"

# --- fd-prebuilt.fd ---
[build.stages.fd-prebuilt.fd]
version = "v10.4.2"

[build.stages.fd-prebuilt.fd.source]
type = "github-release"
repository = "sharkdp/fd"
tag = "v10.4.2"

[build.stages.fd-prebuilt.fd.artifacts.linux-amd64]
url = "https://github.com/sharkdp/fd/releases/download/v10.4.2/fd_10.4.2_amd64.deb"
sha256 = "0e44eb5fca93f09bc6f5430b90acdf44c8e069d0a903700aeb4820629337b67b"

[build.stages.fd-prebuilt.fd.update]
provider = "github-release"
stable_only = true
tag_prefix = "v"
required_platforms = ["linux-amd64"]

# ---------------------------------------------------------------------------
# Node tools — independent cache scopes
# ---------------------------------------------------------------------------

# --- pi-tools.pi ---
[build.stages.pi-tools.pi]
version = "0.85.1"

[build.stages.pi-tools.pi.source]
package = "@earendil-works/pi-coding-agent"
type = "pi-release"
release_repository = "earendil-works/pi"
