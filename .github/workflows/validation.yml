name: Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  production-type-check:
    runs-on: ubuntu-latest
    env:
      PRIVILEGED_HELPERS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python 3.14
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.14"

      - name: Set up reviewed Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"

      - name: Install reviewed npm version
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.16.0
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"

      - name: Provision privilege-test prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo -n apt-get update
          sudo -n apt-get install --yes sudo util-linux
          sudo -n groupadd --force docker-dev
          if ! getent passwd docker-dev >/dev/null; then
            sudo -n useradd --create-home --gid docker-dev docker-dev
          fi
          getent passwd docker-dev
          getent group docker-dev
          getent passwd nobody
          sudo -n runuser -u nobody -- id
          test "$(id -u)" != "$(id -u docker-dev)"

      - name: Install development and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --upgrade pip
          .venv/bin/python -m pip install --disable-pip-version-check \
            --group dev pytest pytest-xdist ty==0.0.73
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python --version
          .venv/bin/python -m ruff --version
          .venv/bin/python -m pytest --version
          .venv/bin/ty --version

      - name: Check production types
        run: scripts/check-types

      - name: Run complete green gate
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          log="$RUNNER_TEMP/green-checks.log"
          set +e
          scripts/check-green >"$log" 2>&1
          status=$?
          set -e
          cat "$log"
          exit "$status"

      - name: Retain complete check diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: green-check-diagnostics
          path: ${{ runner.temp }}/green-checks.log
          if-no-files-found: warn
          retention-days: 7
